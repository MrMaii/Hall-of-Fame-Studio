<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#2a2926" stroke-width="0.5" fill="none"/>
    </pattern>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f4f0"/>
      <stop offset="100%" stop-color="#ebe9e2"/>
    </linearGradient>
  </defs>
  <!-- Light archive room (top 60%) -->
  <rect width="1200" height="378" fill="url(#fadeTop)"/>
  <!-- War room (bottom 40%) -->
  <rect y="378" width="1200" height="252" fill="#0d0c0b"/>
  <rect y="378" width="1200" height="252" fill="url(#grid)" opacity="0.35"/>
  <!-- Divider -->
  <line x1="0" y1="378" x2="1200" y2="378" stroke="#d1d0c9" stroke-width="1" stroke-dasharray="8 6"/>

  <!-- Roundtable (war room) -->
  <ellipse cx="600" cy="504" rx="200" ry="72" stroke="#555" stroke-width="1.5" fill="none"/>
  <ellipse cx="600" cy="504" rx="120" ry="42" stroke="#333" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
  <!-- Seat dots -->
  <g fill="#777">
    <circle cx="600" cy="420" r="14" stroke="#888" stroke-width="1" fill="#1a1a1a"/>
    <circle cx="760" cy="460" r="12" fill="#2a2926" stroke="#666"/>
    <circle cx="720" cy="540" r="12" fill="#2a2926" stroke="#666"/>
    <circle cx="600" cy="580" r="12" fill="#2a2926" stroke="#666"/>
    <circle cx="480" cy="540" r="12" fill="#2a2926" stroke="#666"/>
    <circle cx="440" cy="460" r="12" fill="#2a2926" stroke="#666"/>
  </g>
  <text x="600" y="508" text-anchor="middle" font-family="Consolas, monospace" fill="#888" font-size="10" letter-spacing="2">DIRECTOR</text>
  <!-- Link flow lines -->
  <path d="M600 434 L760 460" stroke="#666" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
  <path d="M600 434 L440 460" stroke="#666" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
  <path d="M760 460 L720 540" stroke="#555" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <path d="M440 460 L480 540" stroke="#555" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Avatar placeholders (top left) -->
  <circle cx="120" cy="120" r="36" fill="#fdfdfc" stroke="#d1d0c9" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="28" fill="#e8e6df"/>
  <text x="120" y="126" text-anchor="middle" font-family="Georgia, serif" fill="#1a1a1a" font-size="22">E</text>
  <circle cx="200" cy="150" r="32" fill="#fdfdfc" stroke="#d1d0c9" stroke-width="1.5"/>
  <circle cx="200" cy="150" r="24" fill="#e8e6df"/>
  <text x="200" y="156" text-anchor="middle" font-family="Georgia, serif" fill="#1a1a1a" font-size="18">A</text>
  <circle cx="280" cy="110" r="28" fill="#fdfdfc" stroke="#d1d0c9" stroke-width="1.5"/>
  <circle cx="280" cy="110" r="20" fill="#e8e6df"/>
  <text x="280" y="116" text-anchor="middle" font-family="Georgia, serif" fill="#1a1a1a" font-size="16">T</text>

  <!-- Title block -->
  <text x="600" y="155" text-anchor="middle" font-family="Georgia, serif" fill="#1a1a1a" font-size="64" font-weight="600">Hall of Fame Studio</text>
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, serif" fill="#444" font-size="26" font-style="italic">Roundtable-first AI virtual team</text>

  <!-- Pill badges -->
  <g font-family="Consolas, monospace">
    <rect x="318" y="230" width="148" height="28" rx="2" fill="#fdfdfc" stroke="#d1d0c9"/>
    <text x="392" y="249" text-anchor="middle" fill="#1a1a1a" font-size="11" letter-spacing="1">40 PERSONAS</text>
    <rect x="478" y="230" width="188" height="28" rx="2" fill="#fdfdfc" stroke="#d1d0c9"/>
    <text x="572" y="249" text-anchor="middle" fill="#1a1a1a" font-size="11" letter-spacing="1">LEADER GOVERNANCE</text>
    <rect x="678" y="230" width="124" height="28" rx="2" fill="#fdfdfc" stroke="#d1d0c9"/>
    <text x="740" y="249" text-anchor="middle" fill="#1a1a1a" font-size="11" letter-spacing="1">BYOK READY</text>
  </g>

  <!-- Dossier card accent -->
  <rect x="920" y="80" width="200" height="140" fill="#fdfdfc" stroke="#d1d0c9" stroke-width="1"/>
  <rect x="928" y="88" width="80" height="8" fill="#d1d0c9"/>
  <rect x="928" y="104" width="160" height="4" fill="#ebe9e2"/>
  <rect x="928" y="114" width="140" height="4" fill="#ebe9e2"/>
  <rect x="928" y="124" width="120" height="4" fill="#ebe9e2"/>
  <polygon points="928,160 988,160 988,200 928,200" fill="none" stroke="#d1d0c9"/>
  <text x="1020" y="320" font-family="Consolas, monospace" fill="#888" font-size="9" letter-spacing="1">WAR ROOM � LIVE SYNC</text>
</svg>
